version: '3.8'

services:
  # 1. PostgreSQL Database for User Service
  postgres-user-db:
    image: postgres:15-alpine
    container_name: postgres-user-db
    environment:
      POSTGRES_DB: fitness_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin@123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MySQL Database for Activity Service
  mysql-activity-db:
    image: mysql:8.0
    container_name: mysql-activity-db
    environment:
      MYSQL_DATABASE: fitness_activity_db
      MYSQL_ROOT_PASSWORD: admin@123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. PostgreSQL with pgvector Extension for AI Service RAG Knowledge Base
  pgvector-ai-db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-ai-db
    environment:
      POSTGRES_DB: fitness_vector_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitness-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # 5. Service Discovery (Eureka Server)
  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "8761:8761"

  # 6. Centralized Config Server
  config-server:
    build: ./configserver
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server

  # 7. Spring Cloud API Gateway
  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

  # 8. User Microservice
  user-service:
    build: ./userservice
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      postgres-user-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 9. Activity Microservice
  activity-service:
    build: ./activityservice
    container_name: activity-service
    ports:
      - "8082:8082"
    depends_on:
      mysql-activity-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 10. AI Microservice (LangChain4j + Gemini AI + pgvector RAG)
  ai-service:
    build: ./aiservice
    container_name: ai-service
    ports:
      - "8083:8083"
    depends_on:
      pgvector-ai-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 11. React.js Real-time Dashboard Frontend
  fitness-frontend:
    build: ./fitness-app-frontend
    container_name: fitness-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
